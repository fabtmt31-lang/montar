# Portage Windows (point ouvert n° 1 du cahier des charges) : la pile MSYS2 (Python, PyQt6,
# MLT, FFmpeg, frei0r) fait tourner le moteur (prototype) et toute la suite de tests passe.
name: Windows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows.yml"
      - "scripts/windows/**"
      - "src/**"
      - "tests/**"

jobs:
  prototype:
    # UCRT64 seulement : MINGW64 n'a plus ni PyQt6 ni MLT (premier passage du prototype)
    name: MSYS2 UCRT64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
      - name: Paquets (chacun à part, pour savoir lesquels manquent)
        run: |
          missing=""
          for p in python python-pyqt6 qt6-svg mlt ffmpeg frei0r-plugins python-numpy \
                   python-pytest swig gcc pkgconf ntldd-git; do
            if pacman -S --needed --noconfirm "${MINGW_PACKAGE_PREFIX}-$p"; then
              echo "installé : $p"
            else
              echo "::warning::paquet MSYS2 introuvable : $p"
              missing="$missing $p"
            fi
          done
          echo "Paquets manquants :${missing:- aucun}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dépendances facultatives de MLT (modules plus, resample, rubberband, sox…)
        continue-on-error: true
        run: |
          deps=$(LANG=C pacman -Si "${MINGW_PACKAGE_PREFIX}-mlt" \
            | awk '/^Optional Deps/{on=1; print; next} on && /^[^ ]/{on=0} on' \
            | grep -o "${MINGW_PACKAGE_PREFIX}-[^ :]*" | sort -u)
          echo "dépendances facultatives : $deps"
          for d in $deps; do pacman -S --needed --noconfirm "$d" || echo "::warning::introuvable : $d"; done
      - name: Modules MLT qui ne se chargent pas (DLL manquantes)
        continue-on-error: true
        run: |
          pacman -Q "${MINGW_PACKAGE_PREFIX}-mlt"
          for dll in "$MINGW_PREFIX"/lib/mlt/*.dll; do
            missing=$(ntldd -R "$dll" 2>/dev/null | grep -i "not found" | grep -viE "(api|ext)-ms-" | sort -u)
            [ -n "$missing" ] && echo "$(basename "$dll") :" && echo "$missing"
          done
          # les « api-ms-* / ext-ms-* » sont des ensembles d'API résolus par Windows : ignorés
          echo "fin de l'analyse"
      - name: Bindings Python de MLT
        run: bash scripts/windows/build_mlt_bindings.sh
      - name: Prototype du moteur
        run: python scripts/windows/prototype.py prototype-windows
      - name: Suite de tests
        run: python -m pytest -q -p no:cacheprovider --junitxml=prototype-windows/tests.xml
      - name: Dossier autonome (Python, Qt, MLT, FFmpeg et DLL)
        run: |
          bash scripts/windows/bundle.sh build/windows/montar
      - name: Essai du dossier autonome, sans MSYS2
        run: |
          B=build/windows/montar
          export PATH=/c/Windows/System32:/c/Windows:/c/Windows/System32/Wbem
          unset MLT_REPOSITORY MLT_DATA MLT_PROFILES_PATH FREI0R_PATH
          "$B/bin/python.exe" -X utf8 -I -m montar --version
          "$B/bin/python.exe" -X utf8 -I -m montar --diagnostic
          MONTAR_PROTOTYPE_INSTALLED=1 "$B/bin/python.exe" -X utf8 -I scripts/windows/prototype.py \
            prototype-windows/dossier-autonome
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path src/montar/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & $iscc /Qp "/DAppVersion=$version" "/DBundleDir=$pwd\build\windows\montar" `
            "/DOutputDir=$pwd\dist" scripts\windows\montar.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # version portable : le même dossier, à décompresser n'importe où
          7z a -tzip -mx=7 "dist\montar-$version-windows-x64-portable.zip" .\build\windows\montar | Select-Object -Last 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist\montar-*-windows-x64* | Format-Table Name, Length
      - name: Délai d'ouverture de l'installateur (information)
        shell: pwsh
        continue-on-error: true
        run: |
          $setup = Get-ChildItem dist\montar-*-windows-x64.exe | Select-Object -First 1
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $setup.FullName -PassThru
          $shown = $null
          while ($sw.Elapsed.TotalSeconds -lt 120 -and -not $shown) {
            Start-Sleep -Milliseconds 200
            $shown = Get-Process | Where-Object { $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -match 'montar|Setup|Installation' } | Select-Object -First 1
          }
          "fenêtre de l'installateur ouverte après {0:N1} s ({1})" -f $sw.Elapsed.TotalSeconds, $shown.MainWindowTitle | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Get-Process | Where-Object { $_.Path -like "$env:TEMP*" -or $_.Id -eq $p.Id } | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Installation silencieuse, démarrage, désinstallation
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\montar-installe"
          $setup = Get-ChildItem dist\montar-*-windows-x64.exe | Select-Object -First 1
          if (-not (Test-Path build\windows\montar\montar.exe)) { Write-Error "lanceur racine absent"; exit 1 }
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir", '/TASKS=assoc'
          & "$dir\bin\python.exe" -X utf8 -I -m montar --diagnostic
          if ($LASTEXITCODE) { exit 1 }
          # l'interface doit démarrer par le lanceur montar.exe et tenir 20 secondes
          $p = Start-Process -FilePath "$dir\bin\montar.exe" -PassThru
          Start-Sleep 20
          $log = "$env:LOCALAPPDATA\montar\cache\logs\montar.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.HasExited) { Write-Error "montar s'est arrêté (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          Start-Sleep 2
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          Start-Sleep 3
          if (Test-Path "$dir\bin") { Write-Error "désinstallation incomplète"; exit 1 }
          "installation, démarrage et désinstallation : OK"
      - uses: actions/upload-artifact@v4
        with:
          name: montar-windows
          path: |
            dist/montar-*-windows-x64.exe
            dist/montar-*-windows-x64-portable.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-windows-UCRT64
          path: prototype-windows/
