# Prototype du portage Windows (point ouvert n° 1 du cahier des charges) : la pile MSYS2
# (Python, PyQt6, MLT, FFmpeg, frei0r) fait-elle tourner le moteur de montar ?
name: Windows (prototype)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows.yml"
      - "scripts/windows/**"
      - "src/montar/engine/**"
      - "src/montar/platform/**"

jobs:
  prototype:
    # UCRT64 seulement : MINGW64 n'a plus ni PyQt6 ni MLT (premier passage du prototype)
    name: MSYS2 UCRT64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
      - name: Paquets (chacun à part, pour savoir lesquels manquent)
        run: |
          missing=""
          for p in python python-pyqt6 qt6-svg mlt ffmpeg frei0r-plugins python-numpy \
                   python-pytest swig gcc pkgconf ntldd-git; do
            if pacman -S --needed --noconfirm "${MINGW_PACKAGE_PREFIX}-$p"; then
              echo "installé : $p"
            else
              echo "::warning::paquet MSYS2 introuvable : $p"
              missing="$missing $p"
            fi
          done
          echo "Paquets manquants :${missing:- aucun}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dépendances facultatives de MLT (modules plus, resample, rubberband, sox…)
        continue-on-error: true
        run: |
          deps=$(LANG=C pacman -Si "${MINGW_PACKAGE_PREFIX}-mlt" \
            | awk '/^Optional Deps/{on=1; print; next} on && /^[^ ]/{on=0} on' \
            | grep -o "${MINGW_PACKAGE_PREFIX}-[^ :]*" | sort -u)
          echo "dépendances facultatives : $deps"
          for d in $deps; do pacman -S --needed --noconfirm "$d" || echo "::warning::introuvable : $d"; done
      - name: Modules MLT qui ne se chargent pas (DLL manquantes)
        continue-on-error: true
        run: |
          pacman -Q "${MINGW_PACKAGE_PREFIX}-mlt"
          for dll in "$MINGW_PREFIX"/lib/mlt/*.dll; do
            missing=$(ntldd -R "$dll" 2>/dev/null | grep -i "not found" | sort -u)
            [ -n "$missing" ] && echo "$(basename "$dll") :" && echo "$missing"
          done
          echo "fin de l'analyse"
      - name: Bindings Python de MLT
        run: bash scripts/windows/build_mlt_bindings.sh
      - name: Prototype du moteur
        run: python scripts/windows/prototype.py prototype-windows
      - name: Suite de tests (informative)
        if: always()
        continue-on-error: true
        run: python -m pytest -q -p no:cacheprovider --junitxml=prototype-windows/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-windows-UCRT64
          path: prototype-windows/
